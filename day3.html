<!DOCTYPE html>
<html lang="en">
<head>
   
    <title>Figure Tag</title>
</head>
<body>
<!-- figure & figcaption tag -->
    <figure>
        <img src="./assets/bhagat_singh.jpeg" alt="Bhagat Singh" width="300" height="400">
        <h4>Bhagat Singh</h4>
        <figcaption>Ideas are immortal, and freedom is their voice.</figcaption>
    </figure>

    <!-- audio tag -->

    <audio controls loop muted autoplay>
        <source src ="assets/bhagat_singh_a.mp3" type="audio/mpeg">
    </audio>
    <br>
    <!-- video tag -->
     <video controls autoplay muted poster="assets/bhagat_singh.jpeg" loop  width="400" height="300" preload="metadata">
        <source src ="assets/bhagat_singh_v.mp4" type="video/mp4" >
    </video>

<table border="1" width="400" height="100">
  <thead>
    <tr>
      <th>Name</th>
      <th>Date of Birth</th>
      <th>Date of Death</th>
    </tr>
  </thead>

  <tbody>
    <tr>
      <td>Bhagat Singh</td>
      <td>28 September 1907</td>
      <td>23 March 1931</td>
    </tr>
  </tbody>

  <tfoot>
    <tr>
      <td rowspan="3">Biography</td>
      <td colspan="2">Freedom fighter and Indian revolutionary</td>
    </tr>
  </tfoot>
</table>



</body>
</html>
