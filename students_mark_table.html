<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Mark Table  </title>
</head>
<body>
    <h3>Student Mark Table</h3>
   <table border="1">
    <thead>
      <tr>
        <th rowspan="2">Subject</th>
        <th colspan="3">Marks</th>
        <th rowspan="2">Grade</th>
      </tr>

      <tr>
        <th>Unit Test</th>
        <th>Mid Term</th>
        <th>Final Exam</th>
      </tr>
    </thead>

    <tbody>
      <tr>
        <td>English</td>
        <td>18</td>
        <td>42</td>
        <td>85</td>
        <td>A</td>
      </tr>

      <tr>
        <td>Maths</td>
        <td>20</td>
        <td>45</td>
        <td>90</td>
        <td>A+</td>
      </tr>

      <tr>
        <td>Science</td>
        <td>19</td>
        <td>40</td>
        <td>88</td>
        <td>A</td>
      </tr>
    </tbody>

    <tfoot>
      <tr>
        <td colspan="4">Result</td>
        <td>Pass</td>
      </tr>
    </tfoot>
  </table>  
</body>
</html>
