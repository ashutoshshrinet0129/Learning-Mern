<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <h1>Registration Form</h1>
    <form action="/submit" method="post">
 <label for="Profile Picture">Profile Picture:</label>
        <input type="file" id="profile-picture" name="profile-picture" required><br><br>

        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required><br><br>

         <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required><br><br>

         <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required><br><br>

        <label for="date">Date of Birth:</label>
        <input type="date" id="date" name="date" placeholder="Enter your date of birth" required><br><br>

         <label for="gender">Gender:</label>
        <select id="gender" name="gender" required>
            <option value="">Select</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
        </select><br><br>

         <label for="course">Course:</label>
        <input type="text" id="course" name="course" placeholder="Enter your course" required><br><br>

        <label for="skills">Skills:</label>
        <input type="text" id="skills" name="skills" placeholder="Enter your skills" required><br><br>

         <label for="address">Address:</label>
        <input type="text" id="address" name="address" placeholder="Enter your address" required><br><br>

        <input type="submit" value="Submit">
    </form>
</body>
</html>
